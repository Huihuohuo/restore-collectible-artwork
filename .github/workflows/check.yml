name: Local processing checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r skills/restore-collectible-artwork/scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_skill.py --output dist/restore-collectible-artwork-skill.zip
      - run: python scripts/verify_release.py dist/restore-collectible-artwork-skill.zip
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: skill-package
          path: dist/restore-collectible-artwork-skill.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: skill-package
          path: dist
      - run: python scripts/verify_release.py dist/restore-collectible-artwork-skill.zip
      - name: Publish the checked package without changing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py dist/restore-collectible-artwork-skill.zip
